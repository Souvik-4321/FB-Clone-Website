<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - FB Clone</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">
            fb-clone
        </div>

        <div class="auth-card">

            <h2>Create a new account</h2>

            <p class="signup-text">
                It's quick and easy.
            </p>

            <form id="registerForm">

                <input
                    type="text"
                    id="firstName"
                    placeholder="First name"
                    required
                >

                <input
                    type="text"
                    id="lastName"
                    placeholder="Last name"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="New password"
                    required
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

                <label class="form-label">
                    Date of birth
                </label>

                <input
                    type="date"
                    id="dateOfBirth"
                    required
                >

                <label class="form-label">
                    Gender
                </label>

                <div class="gender-options">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            required
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>

                </div>

                <button
                    type="submit"
                    class="create-account-button"
                >
                    Create Account
                </button>

            </form>

            <hr>

            <a href="login.html" class="login-link">
                Already have an account?
            </a>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
